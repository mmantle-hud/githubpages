questions:
  - questionId: flask_static_vs_dynamic_pages
    typeName: multipleChoice
    shuffleOptions: true
    prompt: "What is the key difference between static and dynamic web pages?"
    options:
      - answer: "Static pages are fixed HTML files, while dynamic pages are generated by server-side code when a request is made."
        isCorrect: true
        feedback: "Correct. Static pages 'don't change once we've created them', whereas dynamic pages are generated when 'the server passes the request onto a server-side programming language… Code is executed that generates a HTML page.'"
      - answer: "Static pages can only display text, while dynamic pages can display images and CSS."
        isCorrect: false
        feedback: "Incorrect. Both static and dynamic pages can include images and CSS."
      - answer: "Static pages require Python code, while dynamic pages do not."
        isCorrect: false
        feedback: "Incorrect. Static pages are plain HTML; dynamic pages use Python in Flask."
      - answer: "Static pages are sent directly from the browser, while dynamic pages bypass the server entirely."
        isCorrect: false
        feedback: "Incorrect. All pages are requested from a server; dynamic pages are generated on the server before being sent."
  - questionId: flask_routes_basic_understanding
    typeName: multipleChoice
    shuffleOptions: true
    prompt: "What does the @app.route decorator do in a Flask application?"
    options:
      - answer: "It defines a URL route and specifies which view function should run when that route is requested."
        isCorrect: true
        feedback: "Correct. The notes state that '@app.route specifies a route or URL that our application will respond to. This is followed by a view function that will be executed when this route is requested.'"
      - answer: "It starts the Flask development server automatically."
        isCorrect: false
        feedback: "Incorrect. The server is started using 'flask --app app.py run --debug'."
      - answer: "It loads HTML templates from the templates folder."
        isCorrect: false
        feedback: "Incorrect. Templates are loaded using render_template(), not @app.route."
      - answer: "It registers static files such as CSS and images."
        isCorrect: false
        feedback: "Incorrect. Static files are served from the static folder, not via @app.route."
  - questionId: flask_templates_extends_layout
    typeName: multipleChoice
    shuffleOptions: true
    prompt: "What is the purpose of using {% extends 'layout.html' %} in a Flask template?"
    options:
      - answer: "It allows the page to inherit a shared layout so only page‑specific content needs to be defined."
        isCorrect: true
        feedback: "Correct. The notes explain that 'We use a layout page to share a single layout across multiple pages…' and '{% extends 'layout.html' %} states we want to use layout.html as the starting point.'"
      - answer: "It automatically loads all CSS and JavaScript files for the page."
        isCorrect: false
        feedback: "Incorrect. CSS is loaded using url_for(), not through the extends tag."
      - answer: "It converts Python code into HTML before rendering."
        isCorrect: false
        feedback: "Incorrect. Jinja handles placeholders like {{...}}, not the extends tag."
      - answer: "It creates a new route in app.py for the template."
        isCorrect: false
        feedback: "Incorrect. Routes are defined in app.py using @app.route."
  - questionId: flask_route_parameters_hotel_id
    typeName: multipleChoice
    shuffleOptions: true
    prompt: "What is the purpose of the <int:hotel_id> part of the route definition in Flask?"
    options:
      - answer: "It captures an integer from the URL and passes it into the view function as the hotel_id parameter."
        isCorrect: true
        feedback: "Correct. The notes explain: 'In the route definition, see how the final part of the URL has been declared as a variable (<int:hotel_id>). This simply creates a variable to store integers… The hotel_id number from the URL will be passed into this variable.'"
      - answer: "It forces Flask to only accept POST requests for the route."
        isCorrect: false
        feedback: "Incorrect. The HTTP method is controlled separately using the methods argument."
      - answer: "It automatically validates that the hotel exists in the database."
        isCorrect: false
        feedback: "Incorrect. The notes show that the code manually checks for a matching hotel."
      - answer: "It creates a hyperlink for each hotel without needing url_for()."
        isCorrect: false
        feedback: "Incorrect. Hyperlinks are created using url_for(), not the route parameter."
  - questionId: flask_passing_data_render_template
    typeName: multipleChoice
    shuffleOptions: true
    prompt: "How does Flask pass data from a view function into a template?"
    options:
      - answer: "By including keyword arguments in the render_template() call, which Jinja exposes as variables."
        isCorrect: true
        feedback: "Correct. The notes state: 'Flask passes each keyword argument into the template context, where Jinja exposes them as variables.'"
      - answer: "By storing variables in a global dictionary that all templates automatically read."
        isCorrect: false
        feedback: "Incorrect. Flask does not use a global dictionary for template variables."
      - answer: "By writing variables directly into the HTML file before the server starts."
        isCorrect: false
        feedback: "Incorrect. Templates are rendered dynamically at request time."
      - answer: "By creating a separate Python file for each variable passed to a template."
        isCorrect: false
        feedback: "Incorrect. Variables are passed directly through render_template()."
